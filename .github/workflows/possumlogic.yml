name: possum logic

on:
  schedule:
    # Every five minutes across the UTC hours a show anywhere from the east
    # coast to the west can be playing or settling. Almost every one of these
    # runs does nothing: the first step reads site/data/schedule.json, finds no
    # show inside its watch window, and the rest of the job is skipped. That
    # check makes no API call and no network request of any kind.
    #
    # Five rather than ten because many songs are shorter than ten minutes, so
    # a coarser poll can miss one entirely. GitHub delays scheduled runs under
    # load, sometimes considerably, so this is a ceiling on freshness and not a
    # promise of it.
    - cron: "*/5 22-23,0-9 * * *"
    # Once a day regardless: refresh the announced schedule, re-fetch settled
    # shows for corrections, and catch anything the windows missed -- an
    # afternoon set, a festival, a show at a venue we had no time zone for.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for shows"
        default: "21"
  # A template or style change should republish the whole site.
  push:
    branches: [main]
    paths:
      - possumlogic.py
      - .github/workflows/possumlogic.yml

permissions:
  contents: write

concurrency:
  group: possumlogic
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The whole state machine, and it is a file rather than anything in
      # Actions: schedule.json says when the next shows are and what time zone
      # each venue keeps, so this asks a local question and answers it in
      # milliseconds. The daily run never gates -- it is the sweep that catches
      # whatever the windows did not.
      # Two different questions, kept apart because they have different
      # answers. `watching` is whether a show is on stage right now. `work` is
      # whether this particular run should do anything -- which the frequent
      # cron decides from `watching`, and which every other trigger answers yes
      # to unconditionally, because the daily sweep and a manual run exist
      # precisely to cover the times nothing is playing.
      - name: Should this run do anything?
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "*/5 22-23,0-9 * * *" ]; then
            watching=$(python possumlogic.py --site site --watching | cut -d= -f2)
            echo "work=$watching" >> "$GITHUB_OUTPUT"
          else
            echo "work=true" >> "$GITHUB_OUTPUT"
          fi

      # Pillow slices the batched preview-card screenshot; the browser that
      # takes it is already on the runner image. Without both, pages still
      # build and publish -- they just point at previews nobody drew.
      - name: Install what the preview cards need
        if: steps.gate.outputs.work == 'true'
        run: python -m pip install --quiet pillow

      # The previews already published, so a run only draws the ones whose
      # contents actually changed. Without this a fresh checkout has no cards
      # at all and redraws every one of them, which is minutes of browser time
      # to reproduce images identical to the ones already served.
      - name: Restore the published preview cards
        if: steps.gate.outputs.work == 'true'
        run: |
          git fetch --depth=1 origin gh-pages || exit 0
          mkdir -p site/card
          git archive origin/gh-pages card 2>/dev/null | tar -x -C site || true
          echo "restored $(ls site/card 2>/dev/null | wc -l) cards"

      # Adds any show the archive is missing, then re-renders every page from
      # the archive, which costs no API calls.
      - name: Add new shows and render the site
        if: steps.gate.outputs.work == 'true'
        env:
          # The repository secret keeps its name; only the variable the program
          # reads is namespaced. Renaming a secret that a scheduled job depends
          # on, to tidy a string, is not a trade worth making.
          PL_PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}
          # Empty unless the variable is set, and empty means the pages carry
          # no analytics at all rather than a broken tag.
          PL_GOATCOUNTER: ${{ vars.PL_GOATCOUNTER }}
          # Writes site/CNAME and points share URLs at the domain. Publishing
          # replaces the whole gh-pages tree, so this file has to be generated
          # on every run or the custom domain stops resolving after the next
          # publish.
          PL_DOMAIN: ${{ vars.PL_DOMAIN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # The daily run does the expensive, thorough things. A run that fired
          # because a show is on stage wants tonight only, as fast as possible.
          if [ "$SCHEDULE" = "0 15 * * *" ] || [ -z "$SCHEDULE" ]; then
            # --calendar keeps the counting show list current, without which
            # every song's standing freezes. --schedule refreshes the announced
            # dates the gate above reads, and is what makes a withdrawn or
            # moved run correct itself.
            python possumlogic.py --site site --previous --rebuild \
              --catch-up "${{ github.event.inputs.days || 21 }}" --recheck \
              --sweep-ratings --calendar --schedule --phishin
          else
            python possumlogic.py --site site --previous --rebuild --catch-up 2
          fi

      - name: Commit the data archive
        id: archive
        if: steps.gate.outputs.work == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Covers the running order too: --catch-up writes
          # site/data/setlist-order.jsonl for every settled show it fetches,
          # and it is under site/data precisely so this line does not have to
          # know about it.
          git add site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new shows"
          else
            git commit -m "Archive gap reports for new shows"
            # The watcher pushes to main every five minutes during a show, and
            # a person pushing code races both. A rejected push here used to be
            # fatal under `bash -e`, which took the *publish* step below with
            # it: on 2026-07-30 the site sat a build behind over a commit that
            # had already landed, and nothing about the failure said "publish
            # did not run". The publish step has replayed on rejection for a
            # while; this one now does too.
            #
            # Only the site/data JSON is tracked here -- every built page is
            # gitignored -- so the rebase moves per-show files and nothing the
            # publish reads. On conflict it aborts and gives up rather than
            # replaying: a tree mid-rebase has conflict markers *inside* the
            # data files, and `cp -R site/.` would copy them to gh-pages
            # verbatim. That outage has happened here once already. The running
            # order is in that blast radius now: two runs catching up the same
            # show write identical bytes and cannot conflict, two catching up
            # different ones can, and the abort is what keeps a half-merged
            # extract from being published. Losing a night to the next run
            # costs one API call.
            pushed=""
            for attempt in 1 2 3; do
              if git push -q; then pushed=yes; break; fi
              echo "push rejected (attempt $attempt); replaying onto origin/main"
              if ! git pull -q --rebase origin main; then
                git rebase --abort || true
                echo "rebase conflicted; leaving the archive to the next run"
                break
              fi
            done
            # Still publishes either way. The archive commit is the record; the
            # built tree in site/ is correct whether or not that record landed,
            # and withholding the site because a push raced is the failure this
            # is here to stop.
            [ -n "$pushed" ] || echo "archive not pushed; publishing anyway"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Skipped on a quiet scheduled day, so the branch does not collect a
      # commit a day whose only change is the generated-on date in the footer.
      - name: Publish to gh-pages
        if: steps.archive.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          # Publish onto whatever is on the remote *now*, and replay if it
          # moves under us. The watcher publishes every five minutes during a
          # show, so this run and that one race for gh-pages routinely: this
          # step failed twice tonight with "! [rejected] (fetch first)" and
          # would have kept failing all night.
          #
          # Two things were wrong. `git worktree add ../pages gh-pages` names
          # the *local* branch, and `git fetch origin gh-pages` does not move
          # it -- the same stale-base bug publish.sh documents at length and
          # that watch.yml already avoids by naming origin/gh-pages. And a
          # rejected push was fatal rather than retried, though the tree is
          # replaced wholesale here, so replaying costs nothing but a copy.
          published=""
          for attempt in 1 2 3; do
            git fetch -q origin gh-pages
            rm -rf ../pages
            git worktree prune
            git worktree add -q --detach ../pages origin/gh-pages
            find ../pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
            cp -R site/. ../pages/
            # rc must be preset and the subshell guarded with `||`: this step
            # runs under `bash -e`, so an unguarded subshell that returns
            # non-zero kills the step before `rc` could be read.
            rc=0
            (
              cd ../pages
              git add -A
              if git diff --cached --quiet; then
                echo "site unchanged"
                exit 3
              fi
              git commit -q -m "Publish $(date -u +%FT%TZ)"
              # Detached HEAD, so name both ends.
              git push -q origin HEAD:gh-pages
            ) || rc=$?
            git worktree remove --force ../pages 2>/dev/null || true
            if [ "$rc" -eq 3 ]; then published="unchanged"; break; fi
            if [ "$rc" -eq 0 ]; then published="yes"; break; fi
            echo "push rejected (attempt $attempt); someone published first, replaying"
          done
          if [ -z "$published" ]; then
            echo "could not publish after 3 attempts" >&2
            exit 1
          fi
